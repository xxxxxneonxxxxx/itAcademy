<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title></title>
  </head>
  <body>
    <header class="header">
        <a class="logo" href="/">
            <img class= " logo__image" alt="Название компании"/>
        </a>
        <nav class="nav">
            <a class="nav__link"></a>
            <a class="nav__link"></a>
            <a class="nav__link nav__link--active"></a>
            <a class="nav__link"></a>
        </nav>
        <button class="button button--login"></button>
    </header>
    <main class="main">
        <section class="section section--hero">
            <div class="section__content">
                <p class="section__subtitle"></p>

                <h1 class="section__title">
                    <img class="section__logo" alt="LENNI">
                </h1>

                <p class="section__subtitle"></p>
            </div>

            <div class="section__actions">
                <p class="section__action-text"></p>

                <div>
                    <button class="button button--event"></button>
                    <button class="button button--tenants"></button>
                </div>
            </div>

        </section>

        <section class="section section--aboutUs">
            <h2 class="section__title"></h2>

            <article class="article article--about-us">
                <h3 class="article__title"></h3>

                <p class="article__description"></p>

                <img class="article__image1 " />
                <img class="article__image2"/>
            </article>

            <article class="article  article--about-us">
                <h3 class="article__title"></h3>

                <p class="article__description"></p>

                <div>
                    <img class="article__image3"/>

                    <p class="article__description"></p>
                </div>
            </article>

            <aside class="section__aside">
                <button class="button button--arrow">
                    <span class="button__text"></span>

                    <img class="button__icon button__icon--arrow" />
                </button>
            </aside>
        </section>

        <section class="section section--events">
            <h2 class="section__title"></h2>

            <article class="article article--events">
                <img class="article__image"  />

                <h3 class="article__title"></h3>

                <p class="article__description"></p>

                <div class="article__date">
                    <p class="article__date-text">
                        <span>|</span>
                    </p>
                </div>
            </article>

            <article class="article article--events">
                <img class="article__image"/>

                <h3 class="article__title"></h3> 

                <p class="article__description"></p>

                <div class="article__date">
                    <p class="article__date-text">
                        <span>|</span>
                    </p>
                </div>
            </article>

            <article class="article article--events">
                <img class="article__image"/>

                <h3 class="article__title"></h3> 

                <p class="article__description"></p>

                <div class="article__date">
                    <p class="article__date-text">
                        <span>|</span>
                    </p>
                </div>
            </article>

            <div class="section__actions section__actions--events">
                <button class="button button--arrow">
                    <img class="button__icon button__icon--arrow" />
                </button>

                <nav class="nav nav--events">
                    <div class="nav__item"></div>
                    <div class="nav__item"></div>
                    <div class="nav__item nav__item--active"></div>
                    <div class="nav__item"></div>
                    <div class="nav__item"></div>
                </nav>

                <button class="button button--arrow">
                    <img class="button__icon button__icon--arrow" />
                </button>
            </div>

            <aside class="section__aside section__aside--events">
                <a class="section__aside-link" href="#"></a>
            </aside>
        </section>

        <section class="section section--blog">
            <h2 class="section__title"></h2>

            <article class="article article--blog">
                <p class="article__date"></p>

                <h3 class="article__title"></h3>

                <div class="article__description">
                    <p class="article__text">
                    </p>

                    <button class="button button--arrow">
                        <img class="button__icon button__icon--arrow" />
                    </button>
                </div>
            </article>

            <article class="article article--blog">
                <p class="article__date"></p>

                <h3 class="article__title"></h3>

                <div class="article__description">
                    <p class="article__text">
                    </p>

                    <button class="button button--arrow">
                        <img class="button__icon button__icon--arrow" />
                    </button>
                </div>
            </article>

            <article class="article article--blog">
                <p class="article__date"></p>

                <h3 class="article__title"></h3>

                <div class="article__description">
                    <p class="article__text">
                    </p>

                    <button class="button button--arrow">
                        <img class="button__icon button__icon--arrow" />
                    </button>
                </div>
            </article>

            <aside class="section__aside section__aside--blog">
                <a class="section__aside-link" href="#"></a>
            </aside>
        </section>

        <section class="section section--contacts">
            <h2 class="section__title">Contacts</h2>

            <div class="section__content section__content--contacts">
                <div class="section__contacts">
                    <article class="article article--contacts">
                        <img class="article__image" />

                        <div class="article__description">
                            <p class="article__name"></p>
                            <p class="article__position"></p>
                            <p class="article__email"></p>
                        </div>
                    </article>

                    <article class="article article--contacts">
                        <img class="article__image" />

                        <div class="article__description">
                            <p class="article__name"></p>
                            <p class="article__position"></p>
                            <p class="article__email"></p>
                        </div>
                    </article>

                    <article class="article article--contacts">
                        <img class="article__image" />

                        <div class="article__description">
                            <p class="article__name"></p>
                            <p class="article__position"></p>
                            <p class="article__email"></p>
                        </div>
                    </article>

                    <article class="article article--contacts">
                        <img class="article__image" />

                        <div class="article__description">
                            <p class="article__name"></p>
                            <p class="article__position"></p>
                            <p class="article__email"></p>
                        </div>
                    </article>
                </div>

                <img alt="map"/> <!-- не сильно понятно нужно ли будет ставить кнопки приблежения и удаления
                или они уже будут на апи карты -->
            </div>
        </section>

    </main>
    
    <p class="slogan"></p>

    <div class="divider"> <!-- 2 полоски которые разделюят main и footer -->
        <div class="divider__line"></div>
        <div class="divider__line"></div>
    </div>

    <footer class="footer">
        <div class="footer__content">
            <a class="footer__link"></a>
            <a class="footer__link"></a>
            <a class="footer__link"></a>
            <a class="footer__link"></a>
            <a class="footer__link"></a>

            <div class="footer__socials">
                <p class="footer__social-copyright"></p>
                <div>
                    <p class="footer__social-link"></p>
                    <p class="footer__social-link"></p>
                </div>
            </div>
        </div>

        <div class="footer__socials">
            <button class="button footer__button button--social">
                <img class="footer__button-vk"/>
            </button>
            
            <button class=" button footer__button button--social">
                <img class="footer__button-max"/>
            </button>
        </div>

        <div class="footer__form">
            <p class="footer__form-title"></p>
            <form class="footer__form-inputs">
                <div class="footer__form-inputs">
                    <input class="footer__form-input"/>
                    <button class="button footer__form-button"></button>
                </div>
                <div class="footer__form-checkbox">
                    <input type="checkbox"/>
                    <label class="footer__form-text"></label>
                </div>    
            </form>
        </div>

        <aside class="footer__aside">
            <a class="footer__aside-link"></a>
            <img class="footer__aside-image"/>
        </aside>
    </footer>
  </body>
</html>
