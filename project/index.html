<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="header">
        <a class="logo" href="/">
            <img class="logo__image" alt="Название компании"/>
        </a>
        <nav class="nav">
            <a class="nav__link"></a>
            <a class="nav__link"></a>
            <a class="nav__link nav__link--active"></a>
            <a class="nav__link"></a>
        </nav>
        <button class="button button--login"></button>
    </header>
    <main class="main">
        <section class="hero">
            <div class="hero__content">
                <p class="hero__subtitle"></p>

                <h1 class="hero__title">
                    <img class="hero__logo" alt="LENNI">
                </h1>

                <p class="hero__subtitle"></p>
            </div>

            <div class="hero__actions">
                <p class="hero__action-text"></p>

                <div>
                    <button class="button button--event"></button>
                    <button class="button button--tenants"></button>
                </div>
            </div>
        </section>

        <section class="about">
            <h2 class="about__title">О нас</h2>

            <article class="about__article">
                <h3 class="about__subtitle"></h3>

                <p class="about__description"></p>

                <img class="about__image about__image--first" />
                <img class="about__image about__image--second"/>
            </article>

            <article class="about__article">
                <h3 class="about__subtitle"></h3>

                <p class="about__description"></p>

                <div>
                    <img class="about__image about__image--third"/>

                    <p class="about__description"></p>
                </div>
            </article>

            <aside class="about__aside">
                <button class="button button--arrow">
                    <span class="button__text"></span>

                    <img class="button__icon button__icon--arrow" />
                </button>
            </aside>
        </section>

        <section class="events">
            <h2 class="events__title"></h2>

            <article class="event">
                <img class="event__image"  />

                <h3 class="event__title"></h3>

                <p class="event__description"></p>

                <div class="event__date">
                    <p class="event__date-text">
                        <span>|</span>
                    </p>
                </div>
            </article>

            <article class="event">
                <img class="event__image"/>

                <h3 class="event__title"></h3> 

                <p class="event__description"></p>

                <div class="event__date">
                    <p class="event__date-text">
                        <span>|</span>
                    </p>
                </div>
            </article>

            <article class="event">
                <img class="event__image"/>

                <h3 class="event__title"></h3> 

                <p class="event__description"></p>

                <div class="event__date">
                    <p class="event__date-text">
                        <span>|</span>
                    </p>
                </div>
            </article>

            <div class="events__actions">
                <button class="button button--arrow">
                    <img class="button__icon button__icon--arrow" />
                </button>

                <div class="pagination">
                    <span class="pagination__item"></span>
                    <span class="pagination__item"></span>
                    <span class="pagination__item pagination__item--active"></span>
                    <span class="pagination__item"></span>
                    <span class="pagination__item"></span>
                </div>

                <button class="button button--arrow">
                    <img class="button__icon button__icon--arrow" />
                </button>
            </div>

            <aside class="events__aside">
                <a class="events__aside-link" href="#"></a>
            </aside>
        </section>

        <section class="blog">
            <h2 class="blog__title"></h2>

            <article class="post">
                <p class="post__date"></p>

                <h3 class="post__title"></h3>

                <div class="post__description">
                    <p class="post__text">
                    </p>

                    <button class="button button--arrow">
                        <img class="button__icon button__icon--arrow" />
                    </button>
                </div>
            </article>

            <article class="post">
                <p class="post__date"></p>

                <h3 class="post__title"></h3>

                <div class="post__description">
                    <p class="post__text">
                    </p>

                    <button class="button button--arrow">
                        <img class="button__icon button__icon--arrow" />
                    </button>
                </div>
            </article>

            <article class="post">
                <p class="post__date"></p>

                <h3 class="post__title"></h3>

                <div class="post__description">
                    <p class="post__text">
                    </p>

                    <button class="button button--arrow">
                        <img class="button__icon button__icon--arrow" />
                    </button>
                </div>
            </article>

            <aside class="blog__aside">
                <a class="blog__aside-link" href="#"></a>
            </aside>
        </section>

        <section class="contacts">
            <h2 class="contacts__title">Contacts</h2>

            <div class="contacts__content">
                <div class="contacts__list">
                    <article class="contact">
                        <img class="contact__image" />

                        <div class="contact__description">
                            <p class="contact__name"></p>
                            <p class="contact__position"></p>
                            <p class="contact__email"></p>
                        </div>
                    </article>

                    <article class="contact">
                        <img class="contact__image" />

                        <div class="contact__description">
                            <p class="contact__name"></p>
                            <p class="contact__position"></p>
                            <p class="contact__email"></p>
                        </div>
                    </article>

                    <article class="contact">
                        <img class="contact__image" />

                        <div class="contact__description">
                            <p class="contact__name"></p>
                            <p class="contact__position"></p>
                            <p class="contact__email"></p>
                        </div>
                    </article>

                    <article class="contact">
                        <img class="contact__image" />

                        <div class="contact__description">
                            <p class="contact__name"></p>
                            <p class="contact__position"></p>
                            <p class="contact__email"></p>
                        </div>
                    </article>
                </div>

                <img class="contacts__map" alt="map"/> <!-- не сильно понятно нужно ли будет ставить кнопки приблежения и удаления
                или они уже будут на апи карты -->
            </div>
        </section>

    </main>
    
    <p class="slogan"></p>

    <div class="divider"> <!-- 2 полоски которые разделюят main и footer -->
        <div class="divider__line"></div>
        <div class="divider__line"></div>
    </div>

    <footer class="footer">
        <div class="footer__content">
            <a class="footer__link"></a>
            <a class="footer__link"></a>
            <a class="footer__link"></a>
            <a class="footer__link"></a>
            <a class="footer__link"></a>

            <div class="footer__socials">
                <p class="footer__social-copyright"></p>
                <div>
                    <p class="footer__social-link"></p>
                    <p class="footer__social-link"></p>
                </div>
            </div>
        </div>

        <div class="footer__socials">
            <button class="button footer__button button--social">
                <img class="footer__button-vk"/>
            </button>
            
            <button class="button footer__button button--social">
                <img class="footer__button-max"/>
            </button>
        </div>

        <div class="footer__form">
            <p class="footer__form-title"></p>
            <form class="footer__form-inputs">
                <div class="footer__form-inputs">
                    <input class="footer__form-input"/>
                    <button class="button footer__form-button"></button>
                </div>
                <div class="footer__form-checkbox">
                    <input type="checkbox"/>
                    <label class="footer__form-text"></label>
                </div>    
            </form>
        </div>

        <aside class="footer__aside">
            <a class="footer__aside-link"></a>
            <img class="footer__aside-image"/>
        </aside>
    </footer>
  </body>
</html>
